name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Publish and run logic checks
        shell: pwsh
        run: ./build.ps1 -OutputDirectory "$env:RUNNER_TEMP/nabyscape"
      # WPF fixture uses generated sample stories and an in-memory HTTP handler.
      - name: Verify the optional news widget without network or credentials
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'nabyscape/NabyScape.exe'
          $report = Join-Path $env:RUNNER_TEMP 'nabyscape/news-diagnostics'
          $process = Start-Process -FilePath $exe -ArgumentList @('--diagnostics', ('"' + $report + '"'), '--isolated-diagnostics', '--news-only') -WindowStyle Hidden -PassThru -Wait
          Get-Content (Join-Path $report 'integration-report.txt')
          if ($process.ExitCode -ne 0) { throw 'News widget diagnostics failed.' }
      - name: Upload Windows build
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: NabyScape-windows-x64
          path: ${{ runner.temp }}/nabyscape/
          retention-days: 14
