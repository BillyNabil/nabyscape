name: Draft official release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    if: github.repository == 'BillyNabil/nabyscape' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Clean publish, test, package and hash
        shell: pwsh
        run: ./tools/Build-Release.ps1 -Tag "$env:GITHUB_REF_NAME" -OutputDirectory "$env:RUNNER_TEMP/release"
      - name: Create draft only after checks; never overwrite an existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --verify-tag --draft --generate-notes "$env:RUNNER_TEMP/release/NabyScape-win-x64-Setup.exe" "$env:RUNNER_TEMP/release/NabyScape-win-x64-Portable.zip" "$env:RUNNER_TEMP/release/NabyScape-Notices.zip" "$env:RUNNER_TEMP/release/SHA256SUMS"
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed; existing releases are never changed.' }
